spring:
  datasource:
    url: jdbc:h2:mem:carbontrack;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

  data:
    redis:
      repositories:
        enabled: false

  flyway:
    enabled: false

  cache:
    type: simple

  sql:
    init:
      mode: always
      data-locations: classpath:dev-data.sql

server:
  port: ${SERVER_PORT:8081}
